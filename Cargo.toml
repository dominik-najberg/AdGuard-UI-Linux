[workspace]
resolver = "2"
members = [
    "crates/adguard-core",
    "crates/adguard-gui",
    "crates/adguard-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
adguard-core = { path = "crates/adguard-core" }
adguard-tray = { path = "crates/adguard-tray" }

# GUI
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_7"] }

# tray
ksni = "0.3"

# plumbing
async-channel = "2"
strip-ansi-escapes = "0.2"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
# proxy.yaml is read through a generic value tree rather than deserialised into
# structs: `config set <bool key> 1` is accepted by the CLI and writes a literal
# `enabled: 1`, which a strict `bool` field would reject — taking the whole
# document, and every switch on the page, down with it. See config.rs.
yaml-rust2 = "0.11"
