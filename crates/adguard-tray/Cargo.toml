[package]
name = "adguard-tray"
description = "StatusNotifierItem tray indicator for AdGuard UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
adguard-core.workspace = true
async-channel.workspace = true
ksni.workspace = true
thiserror.workspace = true
# `ksni` needs a tokio runtime and the GUI runs a glib main loop, so the tray
# gets a thread of its own. `net`/`time` are for the D-Bus reactor; nothing here
# runs a timer.
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
# A stand-in StatusNotifierWatcher on a private bus, for the registration test.
# The same zbus `ksni` already builds, with the same runtime, so it costs no
# new crates.
zbus = { version = "5", default-features = false, features = ["tokio"] }
