<?xml version="1.0" encoding="UTF-8"?>
<!-- Application icon on the GNOME 128px grid. Keep this basename aligned
     with APP_ID and Icon= in both desktop entries.
     The prohibition mark distinguishes this unofficial frontend from AdGuard.
     Explicit fills, separate filled paths and no inherited styles, strokes or
     use elements: inherited presentation previously rendered black in GNOME.
     Regenerate the nine 16–256px PNGs whenever this SVG changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="edge" x1="24" y1="16" x2="96" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16786b"/>
      <stop offset="1" stop-color="#063e39"/>
    </linearGradient>
    <linearGradient id="face" x1="30" y1="16" x2="96" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ce5b2"/>
      <stop offset="0.45" stop-color="#27bb8c"/>
      <stop offset="1" stop-color="#087c6c"/>
    </linearGradient>
    <linearGradient id="rim" x1="40" y1="12" x2="85" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4ffe2"/>
      <stop offset="1" stop-color="#36bc99"/>
    </linearGradient>
    <linearGradient id="ivory" x1="44" y1="32" x2="85" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcfff0"/>
    </linearGradient>
  </defs>
  <!-- Solid, softly rounded silhouette, with a six-pixel bottom bevel. -->
  <path fill="url(#edge)" d="M64 12 C79 21 92 23 105 25 Q112 26 112 34 V61 C112 87 95 108 68 119 Q64 121 60 119 C33 108 16 87 16 61 V34 Q16 26 23 25 C36 23 49 21 64 12Z"/>
  <path fill="url(#rim)" d="M64 8 C79 17 92 19 105 21 Q112 22 112 30 V55 C112 81 95 102 68 113 Q64 115 60 113 C33 102 16 81 16 55 V30 Q16 22 23 21 C36 19 49 17 64 8Z"/>
  <path fill="url(#face)" d="M64 11 C79 20 92 22 104 24 Q109 25 109 31 V55 C109 80 93 99 67 110 Q64 111.5 61 110 C35 99 19 80 19 55 V31 Q19 25 24 24 C36 22 49 20 64 11Z"/>
  <!-- Broad facets keep the surface legible even at dock size. -->
  <path fill="#baffdf" opacity="0.12" d="M64 11 C49 20 36 22 24 24 Q19 25 19 31 V55 C19 65 22 74 27 82 L64 60Z"/>
  <path fill="#00584f" opacity="0.10" d="M64 60 L102 79 C95 92 83 103 67 110 Q65 111 64 111Z"/>
  <!-- Raised ivory ring with a subtle lower edge. -->
  <path fill="#107a62" fill-rule="evenodd" d="M95 62 A31 31 0 1 0 33 62 A31 31 0 1 0 95 62Z M86.5 62 A22.5 22.5 0 1 0 41.5 62 A22.5 22.5 0 1 0 86.5 62Z"/>
  <path fill="#107a62" d="M51.028 43.018 L82.982 74.972 L76.972 80.982 L45.018 49.028Z"/>
  <path fill="url(#ivory)" fill-rule="evenodd" d="M95 59 A31 31 0 1 0 33 59 A31 31 0 1 0 95 59Z M86.5 59 A22.5 22.5 0 1 0 41.5 59 A22.5 22.5 0 1 0 86.5 59Z"/>
  <path fill="url(#ivory)" d="M51.028 40.018 L82.982 71.972 L76.972 77.982 L45.018 46.028Z"/>
</svg>
